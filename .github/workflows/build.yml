name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Unzip source
        run: |
          mkdir src_unzipped
          unzip -q ./*.zip -d src_unzipped
          GRADLEW=$(find src_unzipped -name gradlew | head -n 1)
          echo "PROJECT_DIR=$(dirname "$GRADLEW")" >> $GITHUB_ENV

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
